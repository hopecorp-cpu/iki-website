name: Build blog

# Khi có bài mới / sửa content-plan / sửa script build -> tự build HTML rồi commit lại.
# KHÔNG trigger khi chỉ blog/** đổi (tránh vòng lặp) — GITHUB_TOKEN push cũng không tự re-trigger.
on:
  push:
    branches: [main]
    paths:
      - 'blog-drafts/**'
      - 'content-plan.json'
      - 'scripts/build-article.mjs'
      - 'scripts/build-structure.mjs'
      - 'scripts/build-tailieu.mjs'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build blog HTML (bài + cấu trúc + sitemap + llms)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Rebuild edited drafts only; keep previously published article layouts intact.
          if [ "$EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            mapfile -t drafts < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" HEAD -- 'blog-drafts/*.md')
            if [ "${#drafts[@]}" -gt 0 ]; then
              node scripts/build-article.mjs "${drafts[@]}"
            else
              node scripts/build-structure.mjs
            fi
          else
            node scripts/build-article.mjs
          fi
      - name: Build trang tài liệu
        run: node scripts/build-tailieu.mjs
      - name: Đồng bộ chân trang IKI
        run: python3 scripts/sync-footer.py
      - name: Commit HTML đã build
        run: |
          git config user.name "hope-blog-bot"
          git config user.email "bot@hopecorp.vn"
          git add blog sitemap.xml llms.txt tai-lieu
          if git diff --cached --quiet; then
            echo "Không có thay đổi HTML."
          else
            git commit -m "build: tự sinh HTML blog [skip ci]"
            git push
          fi
