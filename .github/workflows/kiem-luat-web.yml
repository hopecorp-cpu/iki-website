name: Kiểm luật web

# 5 luật thiết kế (CEO 06/10/2026): nền kem, chữ nghiêng tiêu đề, nhãn 01/02/03, monospace trang trí, nút pill.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm luật web (a–e) trên toàn bộ trang
        run: node scripts/kiem-luat-web.mjs
